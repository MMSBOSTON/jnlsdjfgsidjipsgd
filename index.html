<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>MAJESTIC — Конструктор одежды</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" id="bgGlow" aria-hidden="true"></div>
<div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

<div class="preloader" id="preloader">
  <div class="preloader-inner">
    <div class="preloader-mark">M</div>
    <div class="preloader-bar"><span></span></div>
    <div class="preloader-text">initializing</div>
  </div>
</div>

<header class="topbar">
  <a class="brand" href="#/home">
    <span class="brand-mark">M</span>
    <span class="brand-text">
      <span class="brand-title">MAJESTIC</span>
      <span class="brand-sub">clothing constructor</span>
    </span>
  </a>
  <nav class="topnav">
    <a href="#/home"   data-nav="home">Главная</a>
    <a href="#/editor" data-nav="editor">Конструктор</a>
    <a href="#/guide"  data-nav="guide">Гайд</a>
  </nav>
  <a class="cta" href="#/editor">Создать →</a>
</header>

<main id="view" class="view"></main>

<footer class="footer">
  <span>MAJESTIC CONSTRUCTOR</span>
  <span class="dot"></span>
  <span>статическое приложение · GitHub Pages</span>
</footer>

<div class="toast" id="toast"></div>
<input type="file" id="imageInput" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>

</html>
